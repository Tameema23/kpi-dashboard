<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preload" href="/static/fonts/inter-latin.woff2?v=1" as="font" type="font/woff2" crossorigin>
  <meta name="theme-color" content="#2563eb">
  <meta name="robots" content="noindex, nofollow">
  <title>Book an Appointment</title>
  <link rel="icon" type="image/png" href="/static/images/favicon-48.png?v=1">
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png?v=1">
<style>
/* Self-contained on purpose. This page must never load app.js, whose auth
   guard would redirect an agent with no token straight to the login screen. */

@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('/static/fonts/inter-latin.woff2?v=1') format('woff2');
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', Arial, sans-serif;
  background: #f8fafc;
  color: #0f172a;
  -webkit-font-smoothing: antialiased;
}

.bk-topbar {
  background: linear-gradient(135deg, #1a3faa 0%, #2563eb 50%, #3b82f6 100%);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 11px;
}
.bk-topbar img { width: 30px; height: 30px; border-radius: 7px; }
.bk-topbar span { color: #fff; font-size: 17px; font-weight: 800; letter-spacing: -0.2px; }

.bk-wrap { max-width: 940px; margin: 0 auto; padding: 26px 16px 60px; }

.bk-intro h1 {
  margin: 0 0 6px;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.bk-intro p { margin: 0 0 22px; font-size: 14.5px; color: #64748b; line-height: 1.55; }

.bk-card {
  background: #fff;
  border-radius: 16px;
  border: 1.5px solid #e8edf3;
  box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  overflow: hidden;
}

/* ── Week navigation ── */
.bk-nav {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1.5px solid #f1f5f9;
}
.bk-nav-label { font-size: 14.5px; font-weight: 700; flex: 1; }
.bk-arrow {
  width: 34px; height: 34px;
  border-radius: 9px;
  border: 1.5px solid #e2e8f0;
  background: #fff;
  color: #475569;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}
.bk-arrow:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
.bk-arrow:disabled { opacity: 0.4; cursor: default; }

/* ── Slot grid ── */
.bk-grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.bk-grid { min-width: 620px; padding: 4px 10px 14px; }

.bk-row { display: flex; gap: 6px; }
.bk-gutter {
  width: 68px; flex-shrink: 0;
  font-size: 11.5px; font-weight: 700; color: #94a3b8;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 10px;
}
.bk-head {
  padding: 12px 0 10px;
  text-align: center;
  flex: 1;
}
.bk-head-dow { font-size: 10.5px; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; }
.bk-head-day { font-size: 17px; font-weight: 800; margin-top: 1px; }
.bk-head.is-closed .bk-head-dow,
.bk-head.is-closed .bk-head-day { color: #cbd5e1; }

.bk-slot {
  flex: 1;
  height: 38px;
  margin-bottom: 6px;
  border-radius: 9px;
  border: 1.5px solid transparent;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s, transform 0.1s;
}
.bk-slot.is-open { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
.bk-slot.is-open:hover { background: #dbeafe; border-color: #93c5fd; transform: translateY(-1px); }
.bk-slot.is-taken { background: #f8fafc; border-color: #f1f5f9; color: #cbd5e1; cursor: default; }
.bk-slot.is-selected { background: #2563eb; border-color: #2563eb; color: #fff; }

.bk-empty { padding: 40px 20px; text-align: center; color: #94a3b8; font-size: 14px; }

/* ── Client time zone ── */
.bk-tz {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  padding: 14px 18px;
  background: #fff;
  border: 1.5px solid #e8edf3;
  border-radius: 16px;
}
.bk-tz label { font-size: 13px; font-weight: 700; color: #334155; }
.bk-tz select {
  flex: 0 1 280px;
  min-width: 0;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1.5px solid #e2e8f0;
  background: #fafafa;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  color: #0f172a;
  cursor: pointer;
}
.bk-tz select:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
}
.bk-tz-hint { flex-basis: 100%; margin: 0; font-size: 12.5px; color: #64748b; line-height: 1.5; }
.bk-tz-hint strong { color: #0f172a; }

/* Client's time inside a slot, and a marker when it falls on another day. */
.bk-slot .bk-shift,
.bk-time .bk-shift {
  font-size: 10px;
  font-weight: 800;
  margin-left: 3px;
  opacity: 0.75;
}
.bk-gutter-head { font-size: 10.5px; font-weight: 800; color: #64748b; letter-spacing: 0.3px; }
.bk-time-sub { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; opacity: 0.75; }
.bk-form-head .bk-client-line { margin-top: 3px; color: #475569; font-weight: 600; font-size: 13px; }

.bk-legend {
  display: flex; gap: 18px; align-items: center;
  padding: 12px 18px;
  border-top: 1.5px solid #f1f5f9;
  font-size: 12px; color: #64748b; font-weight: 600;
}
.bk-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; margin-right: 6px; vertical-align: -1px; }

/* ── Booking form ── */
.bk-form { margin-top: 20px; }
.bk-form-head { padding: 16px 18px; border-bottom: 1.5px solid #f1f5f9; }
.bk-form-head h2 { margin: 0 0 3px; font-size: 16px; font-weight: 800; }
.bk-form-head p  { margin: 0; font-size: 13.5px; color: #2563eb; font-weight: 700; }
.bk-form-body { padding: 18px; }

.bk-field { margin-bottom: 15px; }
.bk-field:last-of-type { margin-bottom: 0; }
.bk-field label {
  display: block;
  font-size: 12px; font-weight: 700; color: #475569;
  margin-bottom: 5px;
}
.bk-field label span { font-weight: 500; color: #94a3b8; }
.bk-field input,
.bk-field textarea {
  width: 100%;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1.5px solid #e2e8f0;
  background: #fafafa;
  font-family: inherit;
  font-size: 16px;              /* 16px avoids the iOS zoom-on-focus jump */
  color: #0f172a;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.bk-field textarea { min-height: 84px; resize: vertical; }
.bk-field input:focus,
.bk-field textarea:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
  background: #fff;
}

.bk-submit {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  border: none;
  border-radius: 11px;
  background: #2563eb;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.bk-submit:hover:not(:disabled) { background: #1d4ed8; }
.bk-submit:disabled { background: #cbd5e1; cursor: default; }

.bk-msg {
  margin-top: 14px;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 600;
  display: none;
}
.bk-msg.show { display: block; }
.bk-msg.error { background: #fef2f2; border: 1.5px solid #fecaca; color: #dc2626; }

/* ── Success ── */
.bk-done { padding: 46px 24px; text-align: center; }
.bk-done-mark {
  width: 58px; height: 58px; margin: 0 auto 18px;
  border-radius: 50%;
  background: #dcfce7;
  display: flex; align-items: center; justify-content: center;
}
.bk-done h2 { margin: 0 0 8px; font-size: 21px; font-weight: 800; }
.bk-done p  { margin: 0 0 22px; font-size: 15px; color: #475569; line-height: 1.6; }
.bk-done strong { color: #0f172a; }
.bk-again {
  padding: 11px 24px;
  border: 1.5px solid #e2e8f0;
  border-radius: 10px;
  background: #fff;
  font-family: inherit;
  font-size: 14px; font-weight: 700; color: #475569;
  cursor: pointer;
}
.bk-again:hover { background: #f8fafc; }

.bk-foot { text-align: center; margin-top: 26px; font-size: 12px; color: #94a3b8; }

/* ── Mobile layout ──────────────────────────────────────────────
   A seven column time grid cannot work at phone width, so under 560px the
   week becomes a row of day chips and the chosen day expands into a plain
   vertical list of times. Desktop keeps the grid. */

.bk-days { display: none; }

.bk-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 16px;
  scrollbar-width: none;
}
.bk-chips::-webkit-scrollbar { display: none; }

.bk-chip {
  flex: 0 0 auto;
  min-width: 58px;
  padding: 9px 6px;
  border-radius: 12px;
  border: 1.5px solid #e2e8f0;
  background: #fff;
  font-family: inherit;
  text-align: center;
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s;
}
.bk-chip-dow { font-size: 10.5px; font-weight: 700; color: #94a3b8; letter-spacing: 0.4px; }
.bk-chip-day { font-size: 17px; font-weight: 800; color: #0f172a; margin-top: 1px; }
.bk-chip-dot { width: 5px; height: 5px; border-radius: 50%; background: #2563eb; margin: 4px auto 0; }

.bk-chip.is-active { background: #2563eb; border-color: #2563eb; }
.bk-chip.is-active .bk-chip-dow,
.bk-chip.is-active .bk-chip-day { color: #fff; }
.bk-chip.is-active .bk-chip-dot { background: rgba(255,255,255,0.85); }

.bk-chip:disabled { opacity: 0.45; cursor: default; }
.bk-chip:disabled .bk-chip-dot { visibility: hidden; }

.bk-times { padding: 4px 16px 18px; }
.bk-time {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 8px;
  border-radius: 11px;
  border: 1.5px solid #bfdbfe;
  background: #eff6ff;
  color: #2563eb;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s;
}
.bk-time.is-selected { background: #2563eb; border-color: #2563eb; color: #fff; }
.bk-time:last-child { margin-bottom: 0; }

.bk-none {
  padding: 30px 16px;
  text-align: center;
  color: #94a3b8;
  font-size: 14px;
  font-weight: 600;
}

@media (max-width: 560px) {
  .bk-intro h1 { font-size: 21px; }
  .bk-wrap { padding: 20px 12px calc(48px + env(safe-area-inset-bottom)); }
  .bk-grid-scroll { display: none; }
  .bk-legend    { display: none; }
  .bk-days      { display: block; }
  .bk-nav       { padding: 12px 16px; }
  .bk-nav-label { font-size: 13.5px; }
  .bk-tz { padding: 12px 14px; }
  .bk-tz select { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .bk-chip, .bk-time { transition: none; }
}

@media (prefers-reduced-motion: reduce) {
  .bk-slot, .bk-arrow, .bk-submit { transition: none; }
  .bk-slot.is-open:hover { transform: none; }
}
</style>
</head>
<body>

<div class="bk-topbar">
  <img decoding="async" src="/static/images/logo-96.png?v=1" alt="">
  <span>ApexTrack</span>
</div>

<div class="bk-wrap">

  <div class="bk-intro">
    <h1>Book an appointment</h1>
    <p>Pick an available time below, then add the client's details.</p>
    <p id="leadNote" style="display:none;margin-top:-14px;font-weight:600;color:#475569;"></p>
  </div>

  <div class="bk-tz" id="tzBar" style="display:none;">
    <label for="tzSelect">Client's time zone</label>
    <select id="tzSelect"></select>
    <p class="bk-tz-hint" id="tzHint"></p>
  </div>

  <div class="bk-card" id="gridCard">
    <div id="availabilityError" class="bk-empty" role="status" hidden>
      <span id="availabilityMessage"></span>
      <button type="button" class="bk-again" id="availabilityRetry">Retry</button>
    </div>
    <div class="bk-nav">
      <button class="bk-arrow" id="prevBtn" aria-label="Previous week">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="bk-nav-label" id="weekLabel">Loading…</div>
      <button class="bk-arrow" id="nextBtn" aria-label="Next week">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="bk-grid-scroll">
      <div class="bk-grid" id="grid">
        <div class="bk-empty">Loading availability...</div>
      </div>
    </div>

    <div class="bk-days" id="days"></div>

    <div class="bk-legend">
      <span><i style="background:#eff6ff;border:1.5px solid #bfdbfe;"></i>Available</span>
      <span><i style="background:#f8fafc;border:1.5px solid #f1f5f9;"></i>Unavailable</span>
      <span id="legendTz" style="display:none;"></span>
    </div>
  </div>

  <div class="bk-card bk-form" id="formCard" style="display:none;">
    <div class="bk-form-head">
      <h2>Appointment details</h2>
      <p id="chosenLabel"></p>
      <p class="bk-client-line" id="chosenClient" style="display:none;"></p>
    </div>
    <div class="bk-form-body">
      <div class="bk-field">
        <label for="f_name">Client name</label>
        <input id="f_name" type="text" maxlength="200" autocomplete="off" placeholder="Full name">
      </div>
      <div class="bk-field">
        <label for="f_agent">Booked by <span>(optional)</span></label>
        <input id="f_agent" type="text" maxlength="120" autocomplete="off" placeholder="Your name">
      </div>
      <div class="bk-field">
        <label for="f_comments">Comments / Notes <span>(optional)</span></label>
        <textarea id="f_comments" maxlength="2000" placeholder="Add a note..."></textarea>
      </div>
      <button class="bk-submit" id="submitBtn">Confirm booking</button>
      <div class="bk-msg" id="formMsg"></div>
    </div>
  </div>

  <div class="bk-card" id="doneCard" style="display:none;">
    <div class="bk-done">
      <div class="bk-done-mark">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>Appointment booked</h2>
      <p id="doneText"></p>
      <button class="bk-again" id="againBtn">Book another</button>
    </div>
  </div>

  <div class="bk-foot">Powered by ApexTrack</div>

</div>

<script>
(function () {
  "use strict";

  var SLUG = location.pathname.split("/").filter(Boolean).pop();
  var DOW  = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MON  = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
              "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  var WINDOW_DAYS = 7;

  var data      = null;   // availability for the week currently displayed
  var weekStart = null;   // Date of the leftmost day in view
  var today     = null;   // first bookable day, set from the first response
  var selected  = null;   // { date, hour }
  var openDay   = null;   // mobile only: which day's times are expanded
  var loading   = false;
  var requestId = 0;
  var requestedWeek = null;
  var booking = false;
  var linkClosed = false;
  var clientTz  = null;   // client's IANA zone; null until the server says the default

  // Time zone rules live on the server (backend/timezones.py) with current
  // IANA data. This page never converts times itself: each open slot arrives
  // with the client's local time already worked out for that exact date.

  // A seven column grid is unusable at phone width, so below this the same
  // data is presented as day chips plus a vertical list of times.
  var mq = window.matchMedia("(max-width: 560px)");

  var el = {
    grid:    document.getElementById("grid"),
    label:   document.getElementById("weekLabel"),
    prev:    document.getElementById("prevBtn"),
    next:    document.getElementById("nextBtn"),
    days:    document.getElementById("days"),
    formCard:document.getElementById("formCard"),
    doneCard:document.getElementById("doneCard"),
    gridCard:document.getElementById("gridCard"),
    chosen:  document.getElementById("chosenLabel"),
    msg:     document.getElementById("formMsg"),
    submit:  document.getElementById("submitBtn"),
    tzBar:   document.getElementById("tzBar"),
    tzSel:   document.getElementById("tzSelect"),
    tzHint:  document.getElementById("tzHint"),
    legendTz:document.getElementById("legendTz"),
    chosenClient: document.getElementById("chosenClient")
  };

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function parseDate(iso) {
    var p = iso.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function isoOf(d) {
    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0");
  }

  function addDays(d, n) {
    var out = new Date(d.getTime());
    out.setDate(out.getDate() + n);
    return out;
  }

  function fmtHour(h) {
    var suffix = h >= 12 ? "PM" : "AM";
    var hr = h % 12; if (hr === 0) hr = 12;
    return hr + ":00 " + suffix;
  }

  // Business zone short label ("MT") and whether the client is elsewhere.
  function bizAbbrev() { return (data && data.tz_abbrev) || "MT"; }
  function converting() {
    return !!(data && data.client_tz && data.client_tz.id !== data.timezone);
  }
  function clientAbbrev() { return (data && data.client_tz && data.client_tz.abbrev) || ""; }

  // The client's time for one slot, e.g. {time: "12:00 PM", shift: 0}, or null.
  function localFor(day, hIdx) {
    return converting() && day.local ? day.local[hIdx] : null;
  }

  function shiftMark(shift) {
    if (!shift) return "";
    var text = shift > 0 ? "+" + shift + "d" : "\u2212" + Math.abs(shift) + "d";
    var title = shift > 0 ? "Next day for the client" : "Previous day for the client";
    return '<span class="bk-shift" title="' + title + '">' + text + "</span>";
  }

  function shiftWords(shift) {
    if (!shift) return "";
    return shift > 0 ? " (next day)" : " (previous day)";
  }

  // Fill the dropdown once from the server's list, then keep it in sync.
  function syncTimezones() {
    if (!data || !Array.isArray(data.timezones) || !data.timezones.length) {
      el.tzBar.style.display = "none";
      return;
    }
    if (!el.tzSel.options.length) {
      data.timezones.forEach(function (z) {
        var opt = document.createElement("option");
        opt.value = z.id;
        opt.textContent = z.label + " (" + z.abbrev + ")";
        el.tzSel.appendChild(opt);
      });
    }
    if (clientTz === null && data.client_tz) clientTz = data.client_tz.id;
    el.tzSel.value = clientTz;
    el.tzBar.style.display = "";

    if (converting()) {
      el.tzHint.innerHTML = "The calendar runs on <strong>" + esc(bizAbbrev()) +
        "</strong>. Each open time shows when it is for the client in <strong>" +
        esc(clientAbbrev()) + "</strong>.";
      el.legendTz.textContent = "Rows: " + bizAbbrev() + ". Buttons: client's time (" + clientAbbrev() + ").";
      el.legendTz.style.display = "";
    } else {
      el.tzHint.innerHTML = "All times are <strong>" + esc(bizAbbrev()) +
        "</strong>. If the client is somewhere else, pick their time zone to see their local time.";
      el.legendTz.style.display = "none";
    }
  }

  function showError(text) {
    el.msg.textContent = text;
    el.msg.className = "bk-msg error show";
  }

  function clearError() {
    el.msg.className = "bk-msg";
  }

  // ── Load one week ─────────────────────────────────────────────
  // Each navigation fetches only the week being shown, so the calendar runs
  // forward with no limit and always reflects the planner as it stands now.
  var availabilityError = document.getElementById("availabilityError");
  var availabilityMessage = document.getElementById("availabilityMessage");
  var retryButton = document.getElementById("availabilityRetry");

  function updateSubmit() {
    el.submit.disabled = booking || linkClosed || !data || data.client_tz.id !== clientTz;
  }

  async function load(targetWeek = weekStart) {
    var id = ++requestId;
    requestedWeek = targetWeek;
    loading = true;
    el.prev.disabled = el.next.disabled = true;

    var qs = "?days=" + WINDOW_DAYS + (targetWeek ? "&start=" + isoOf(targetWeek) : "") +
             (clientTz ? "&tz=" + encodeURIComponent(clientTz) : "");
    try {
      var res = await fetch("/api/book/" + encodeURIComponent(SLUG) + "/availability" + qs);
      if (id !== requestId) return;
      if (res.status === 404) {
        linkClosed = true;
        availabilityMessage.textContent = "This booking link has closed. Please contact the office for a current link.";
        availabilityError.hidden = false;
        retryButton.hidden = true;
        return;
      }
      if (!res.ok) throw new Error("unavailable");
      var fresh = await res.json();
      if (id !== requestId) return;
      data = fresh;
      linkClosed = false;
      availabilityError.hidden = true;
      weekStart = parseDate(data.start);
      today = parseDate(data.today || data.start);

      var note = document.getElementById("leadNote");
      note.textContent = "Same-day appointments need at least " + data.lead_hours + " hours' notice.";
      note.style.display = data.lead_hours > 0 ? "" : "none";

      syncTimezones();
      dropStaleSelection();
      render();
      if (selected && el.formCard.style.display !== "none") updateChosen();
    } catch (e) {
      if (id !== requestId) return;
      availabilityMessage.textContent = "Could not refresh availability. Please try again.";
      availabilityError.hidden = false;
      retryButton.hidden = false;
      if (!data) el.grid.textContent = "";
    } finally {
      if (id === requestId) {
        loading = false;
        updateNav();
        updateSubmit();
      }
    }
  }

  retryButton.addEventListener("click", function () { load(requestedWeek); });

  // After a refresh, the slot the agent picked may have been booked, blocked
  // on the planner, or pushed inside the notice window. Drop it and say so
  // rather than letting the agent fill in the form for a slot that is gone.
  function dropStaleSelection() {
    if (!selected || !data) return;
    var day = data.days.filter(function (d) { return d.date === selected.date; })[0];
    if (!day) return;                       // selected day is in another week
    var hIdx = data.hours.indexOf(selected.hour);
    if (!day.closed && hIdx !== -1 && day.slots[hIdx]) return;
    selected = null;
    // Keep the form and whatever the agent typed; just ask for a new time.
    if (el.formCard.style.display !== "none") {
      el.chosen.textContent = "Choose a new time above.";
      el.chosenClient.style.display = "none";
      showError("That time is no longer available. Please pick another time.");
    }
  }

  function updateNav() {
    if (!data || linkClosed) { el.prev.disabled = el.next.disabled = true; return; }
    el.prev.disabled = loading || isoOf(weekStart) <= isoOf(today);
    el.next.disabled = loading || (data.last_bookable_date &&
      isoOf(addDays(weekStart, WINDOW_DAYS)) > data.last_bookable_date);
  }

  // ── Render ────────────────────────────────────────────────────
  function dayHasOpening(day) {
    return !day.closed && day.slots.indexOf(true) !== -1;
  }

  function render() {
    var days = data.days;

    if (!data.hours.length || !days.length) {
      el.grid.innerHTML = '<div class="bk-empty">No times are currently available.</div>';
      el.days.innerHTML = "";
      el.label.textContent = "";
      return;
    }

    renderHeader(days);
    renderGrid(days);
    renderDays(days);
  }

  function renderHeader(days) {
    var first = parseDate(days[0].date);
    var last  = parseDate(days[days.length - 1].date);
    el.label.textContent =
      MON[first.getMonth()] + " " + first.getDate() + " – " +
      MON[last.getMonth()]  + " " + last.getDate()  + ", " + last.getFullYear();

    updateNav();
  }

  // ── Desktop: hour grid ────────────────────────────────────────
  function renderGrid(days) {
    var html = '<div class="bk-row"><div class="bk-gutter"><span class="bk-gutter-head">' +
               esc(bizAbbrev()) + "</span></div>";
    days.forEach(function (day) {
      var d = parseDate(day.date);
      html += '<div class="bk-head' + (day.closed ? " is-closed" : "") + '">' +
                '<div class="bk-head-dow">' + DOW[d.getDay()] + "</div>" +
                '<div class="bk-head-day">' + d.getDate() + "</div>" +
              "</div>";
    });
    html += "</div>";

    data.hours.forEach(function (hour, hIdx) {
      html += '<div class="bk-row"><div class="bk-gutter">' + fmtHour(hour) + "</div>";
      days.forEach(function (day) {
        var open = !day.closed && day.slots[hIdx];
        var isSel = selected && selected.date === day.date && selected.hour === hour;
        if (open) {
          var loc  = localFor(day, hIdx);
          var text = isSel ? "Selected"
                   : loc ? esc(loc.time) + shiftMark(loc.shift)
                   : "Open";
          var tip  = loc ? ' title="' + fmtHour(hour) + " " + esc(bizAbbrev()) + " = " +
                           esc(loc.time) + " " + esc(clientAbbrev()) + shiftWords(loc.shift) + '"' : "";
          html += '<button class="bk-slot is-open' + (isSel ? " is-selected" : "") + '"' +
                  ' data-date="' + day.date + '" data-hour="' + hour + '"' + tip + '>' +
                  text + "</button>";
        } else {
          html += '<div class="bk-slot is-taken" aria-hidden="true"></div>';
        }
      });
      html += "</div>";
    });

    el.grid.innerHTML = html;

    bindSlots(el.grid.querySelectorAll(".bk-slot.is-open"));
  }

  // ── Mobile: day chips plus a vertical list of times ───────────
  function renderDays(days) {
    // Default to the first day in view that actually has an opening.
    if (openDay === null || days.map(function (d) { return d.date; }).indexOf(openDay) === -1) {
      var firstOpen = days.filter(dayHasOpening)[0];
      openDay = firstOpen ? firstOpen.date : null;
    }

    var chips = '<div class="bk-chips">';
    days.forEach(function (day) {
      var d       = parseDate(day.date);
      var bookable = dayHasOpening(day);
      chips += '<button class="bk-chip' + (day.date === openDay ? " is-active" : "") + '"' +
               ' data-date="' + day.date + '"' + (bookable ? "" : " disabled") + '>' +
                 '<div class="bk-chip-dow">' + DOW[d.getDay()] + "</div>" +
                 '<div class="bk-chip-day">' + d.getDate() + "</div>" +
                 '<div class="bk-chip-dot"></div>' +
               "</button>";
    });
    chips += "</div>";

    var day = days.filter(function (x) { return x.date === openDay; })[0];
    var body;

    if (!day) {
      body = '<div class="bk-none">No openings this week.<br>Try the next week.</div>';
    } else {
      var times = "";
      data.hours.forEach(function (hour, hIdx) {
        if (!day.slots[hIdx]) return;
        var isSel = selected && selected.date === day.date && selected.hour === hour;
        var loc = localFor(day, hIdx);
        var label = loc
          ? esc(loc.time) + " " + esc(clientAbbrev()) + shiftMark(loc.shift) +
            '<span class="bk-time-sub">' + fmtHour(hour) + " " + esc(bizAbbrev()) + "</span>"
          : fmtHour(hour);
        times += '<button class="bk-time' + (isSel ? " is-selected" : "") + '"' +
                 ' data-date="' + day.date + '" data-hour="' + hour + '">' +
                 label + "</button>";
      });
      body = times
        ? '<div class="bk-times">' + times + "</div>"
        : '<div class="bk-none">No openings on this day.</div>';
    }

    el.days.innerHTML = chips + body;

    Array.prototype.forEach.call(el.days.querySelectorAll(".bk-chip"), function (chip) {
      chip.addEventListener("click", function () {
        openDay = chip.dataset.date;
        renderDays(data.days);
      });
    });

    bindSlots(el.days.querySelectorAll(".bk-time"));
  }

  function bindSlots(nodes) {
    Array.prototype.forEach.call(nodes, function (btn) {
      btn.addEventListener("click", function () {
        if (linkClosed) return;
        selected = { date: btn.dataset.date, hour: parseInt(btn.dataset.hour, 10) };
        clearError();
        render();
        showForm();
      });
    });
  }

  // "Thu, Oct 29 at 10:00 AM MT", plus the client's time when they are elsewhere.
  function updateChosen() {
    if (!selected) return;
    var d = parseDate(selected.date);
    el.chosen.textContent =
      DOW[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate() +
      " at " + fmtHour(selected.hour) + " " + bizAbbrev();

    var loc = null;
    if (data && converting()) {
      var day  = data.days.filter(function (x) { return x.date === selected.date; })[0];
      var hIdx = data.hours.indexOf(selected.hour);
      if (day && hIdx !== -1) loc = localFor(day, hIdx);
    }
    if (loc) {
      el.chosenClient.textContent = "For the client: " + loc.time + " " +
        clientAbbrev() + shiftWords(loc.shift);
      el.chosenClient.style.display = "";
    } else {
      el.chosenClient.style.display = "none";
    }
  }

  function showForm() {
    updateChosen();
    el.formCard.style.display = "";
    el.formCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
    document.getElementById("f_name").focus({ preventScroll: true });
  }

  // Rotating the phone or resizing the window can cross the breakpoint. Both
  // layouts are already in the DOM, but the chips need their selection state
  // recalculated for the newly visible week.
  var onBreakpoint = function () { if (data) render(); };   // re-render only, no refetch
  if (mq.addEventListener) { mq.addEventListener("change", onBreakpoint); }
  else if (mq.addListener) { mq.addListener(onBreakpoint); }

  el.tzSel.addEventListener("change", function () {
    clientTz = el.tzSel.value;
    updateSubmit();
    load(loading ? requestedWeek : weekStart);
  });

  el.prev.addEventListener("click", function () {
    if (loading || !weekStart) return;
    var back = addDays(weekStart, -WINDOW_DAYS);
    openDay = null;
    load(today && back < today ? today : back);
  });

  el.next.addEventListener("click", function () {
    if (loading || !weekStart) return;
    openDay = null;
    load(addDays(weekStart, WINDOW_DAYS));
  });

  // Availability changes while the page sits open, so refresh whatever week is
  // on screen when the agent comes back to the tab, and every 30 seconds
  // while it is visible. A block added on the planner, a slot another agent
  // just took, or a slot sliding inside the notice window all show up without
  // a manual reload.
  var POLL_MS = 30000;
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && data && !loading && !booking && !linkClosed) load();
  });
  setInterval(function () {
    if (document.hidden || !data || loading || linkClosed || !availabilityError.hidden) return;
    if (el.doneCard.style.display !== "none") return;   // on the success screen
    if (booking) return;                     // a booking is in flight
    load();
  }, POLL_MS);

  // ── Submit ────────────────────────────────────────────────────
  el.submit.addEventListener("click", async function () {
    if (!selected) { showError("Please choose a time first."); return; }

    var name = document.getElementById("f_name").value.trim();
    if (!name) {
      showError("Client name is required.");
      document.getElementById("f_name").focus();
      return;
    }

    if (el.submit.disabled) return;
    clearError();
    booking = true;
    updateSubmit();
    el.submit.textContent = "Booking…";

    var body = {
      lead_name:     name,
      scheduled_for: selected.date + "T" +
                     String(selected.hour).padStart(2, "0") + ":00",
      comments:      document.getElementById("f_comments").value.trim(),
      booked_by:     document.getElementById("f_agent").value.trim(),
      booking_tz:    clientTz || ""
    };

    try {
      var res = await fetch("/api/book/" + encodeURIComponent(SLUG), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      var out = await res.json().catch(function () { return {}; });

      if (res.ok) {
        var doneHtml =
          "<strong>" + esc(name) + "</strong> is booked for<br>" +
          "<strong>" + esc(out.date || "") + " at " + esc(out.time || "") + "</strong>.";
        if (out.client_time) {
          doneHtml += "<br>For the client that is <strong>" + esc(out.client_date || "") +
            " at " + esc(out.client_time) + "</strong>.";
        }
        doneHtml += "<br><br>Please give the client their local appointment time. The agency confirms attendance separately.";
        document.getElementById("doneText").innerHTML = doneHtml;
        el.gridCard.style.display = "none";
        el.formCard.style.display = "none";
        el.doneCard.style.display = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      showError(out.detail || "Could not book that time. Please try another.");
      // The slot may have just been taken, so refresh and let the grid tell the truth.
      if (res.status === 409) { selected = null; openDay = null; await load(); }
    } catch (e) {
      showError("Network error. Please try again.");
    } finally {
      booking = false;
      updateSubmit();
      el.submit.textContent = "Confirm booking";
    }
  });

  document.getElementById("againBtn").addEventListener("click", function () {
    selected = null;
    openDay  = null;
    ["f_name", "f_agent", "f_comments"].forEach(function (id) {
      document.getElementById(id).value = "";
    });
    clearError();
    el.doneCard.style.display = "none";
    el.gridCard.style.display = "";
    load();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  load();
})();
</script>

</body>
</html>
